# ============================================================
# KONFORME — netlify.toml
# Netlify configuration file
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/
# ============================================================

# ─── BUILD SETTINGS ───────────────────────────────────────
[build]
  publish = "."        # Root folder is the site (index.html is at root)
  command = ""         # No build command needed (plain HTML/CSS/JS)

# ─── REDIRECTS ────────────────────────────────────────────
# Redirect www to non-www (canonical domain)
[[redirects]]
  from   = "https://www.konforme.io/*"
  to     = "https://konforme.io/:splat"
  status = 301
  force  = true

# Redirect HTTP to HTTPS (Netlify does this automatically,
# but explicit is better practice)
[[redirects]]
  from   = "http://konforme.io/*"
  to     = "https://konforme.io/:splat"
  status = 301
  force  = true

# ─── SECURITY HEADERS ─────────────────────────────────────
# Important for a cybersecurity company — these protect
# your site and signal trust to enterprise buyers
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking
    X-Frame-Options = "DENY"

    # Stop browsers from guessing content types
    X-Content-Type-Options = "nosniff"

    # Control referrer info sent to other sites
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Force HTTPS for 1 year (including subdomains)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Restrict what browsers can load (Content Security Policy)
    # Allows: self, Google Fonts, your own scripts
    Content-Security-Policy = "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; img-src 'self' data:; connect-src 'self';"

    # Disable browser features you don't use
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# ─── CACHE HEADERS ────────────────────────────────────────
# CSS and JS: cache for 1 year (Netlify fingerprints these)
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML: always revalidate so updates go live immediately
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
