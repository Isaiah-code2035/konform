# ============================================================
# KONFORME — netlify.toml
# Netlify configuration file
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/
# ============================================================

# ─── BUILD SETTINGS ───────────────────────────────────────
[build]
  publish = "."        # Root folder is the site (index.html is at root)
  command = ""         # No build command needed (plain HTML/CSS/JS)

# ─── REDIRECTS ────────────────────────────────────────────
# Redirect www to non-www (canonical domain)
[[redirects]]
  from   = "https://www.konforme.io/*"
  to     = "https://konforme.io/:splat"
  status = 301
  force  = true

# Redirect HTTP to HTTPS
[[redirects]]
  from   = "http://konforme.io/*"
  to     = "https://konforme.io/:splat"
  status = 301
  force  = true

# ─── CLEAN URLs ──────────────────────────────────────────
[[redirects]]
  from   = "/privacy"
  to     = "/privacy.html"
  status = 200

[[redirects]]
  from   = "/pricing"
  to     = "/pricing.html"
  status = 200

[[redirects]]
  from   = "/article-21"
  to     = "/article-21.html"
  status = 200

[[redirects]]
  from   = "/jurisdictions"
  to     = "/jurisdictions.html"
  status = 200

[[redirects]]
  from   = "/security"
  to     = "/security.html"
  status = 200

# Language pages — serve /xx/ as /xx/index.html
[[redirects]]
  from   = "/de"
  to     = "/de/index.html"
  status = 200

[[redirects]]
  from   = "/fr"
  to     = "/fr/index.html"
  status = 200

[[redirects]]
  from   = "/pt"
  to     = "/pt/index.html"
  status = 200

[[redirects]]
  from   = "/es"
  to     = "/es/index.html"
  status = 200

[[redirects]]
  from   = "/it"
  to     = "/it/index.html"
  status = 200

[[redirects]]
  from   = "/nl"
  to     = "/nl/index.html"
  status = 200

[[redirects]]
  from   = "/pl"
  to     = "/pl/index.html"
  status = 200

# Locale sub-page clean URLs
[[redirects]]
  from   = "/:lang/pricing"
  to     = "/:lang/pricing.html"
  status = 200

[[redirects]]
  from   = "/:lang/article-21"
  to     = "/:lang/article-21.html"
  status = 200

[[redirects]]
  from   = "/:lang/jurisdictions"
  to     = "/:lang/jurisdictions.html"
  status = 200

[[redirects]]
  from   = "/:lang/security"
  to     = "/:lang/security.html"
  status = 200

# ─── BLOCK ACCESS TO SENSITIVE FILES ─────────────────────
# Return 404 for config files, dotfiles, and source control
[[redirects]]
  from   = "/netlify.toml"
  to     = "/index.html"
  status = 404
  force  = true

[[redirects]]
  from   = "/.git/*"
  to     = "/index.html"
  status = 404
  force  = true

[[redirects]]
  from   = "/.env*"
  to     = "/index.html"
  status = 404
  force  = true

[[redirects]]
  from   = "/.gitignore"
  to     = "/index.html"
  status = 404
  force  = true

# ─── SECURITY HEADERS ─────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking
    X-Frame-Options = "DENY"

    # Stop browsers from guessing content types
    X-Content-Type-Options = "nosniff"

    # Control referrer info sent to other sites
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Force HTTPS for 1 year (including subdomains)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Content Security Policy — strict, self-hosted assets only
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://app.konforme.io;"

    # Disable browser features you don't use + opt out of FLoC/Topics
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), interest-cohort=()"

    # Prevent Adobe cross-domain policy file loading
    X-Permitted-Cross-Domain-Policies = "none"

    # Prevent DNS prefetch abuse
    X-DNS-Prefetch-Control = "off"

# ─── CACHE HEADERS ────────────────────────────────────────
# CSS and JS: cache for 1 year (Netlify fingerprints these)
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Fonts: cache for 1 year (immutable)
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML: always revalidate so updates go live immediately
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Sitemap and robots: revalidate frequently
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
